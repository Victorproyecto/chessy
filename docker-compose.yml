version: '3.8'

services:
    php:
        build: .
        container_name: symfony_php
        volumes:
            - ./:/var/www/html

    nginx:
        image: nginx:alpine
        ports:
            - "8080:80"
        volumes:
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
            - ./:/var/www/html
        depends_on:
            - php
