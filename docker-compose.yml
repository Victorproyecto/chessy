services:
    php:
        build: .
        container_name: symfony_php
        volumes:
            - ./:/var/www/html
        depends_on:
            - mongodb

    nginx:
        image: nginx:alpine
        ports:
            - "8080:80"
        volumes:
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
            - ./:/var/www/html
        depends_on:
            - php

    mongodb:
        image: mongo:7
        ports:
            - "27017:27017"
        volumes:
            - mongodb_data:/data/db

volumes:
    mongodb_data:
